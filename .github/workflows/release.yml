name: Draft GitHub Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Create draft GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh release create "${TAG}" \
            --draft \
            --verify-tag \
            --title "${TAG}" \
          
        #  --notes-file RELEASE_NOTES.md
