# git-cliff
# Ref: https://git-cliff.org/docs/configuration
# ---------------------------------------------

[changelog]
body = """
**Full Changelog**: <<REPO>/compare/{{ previous.version }}..{{ version }}>
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        - **{{commit.scope}}:**{% if commit.breaking %} [**breaking**]{% endif %} \
            {{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if commit.scope -%}
        {% else -%}
            - {% if commit.breaking %} [**breaking**]{% endif %}\
                {{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))
        {% endif -%}
    {% endfor -%}
{% endfor %}
## Installation

You can install this release from [PyPI](https://pypi.org/project/{{ remote.github.repo }}/{{ version }}) using uv:

```console
uv add {{ remote.github.repo }}=={{ version }}
```

or with pip:

```console
python -m pip install {{ remote.github.repo }}=={{ version }}
```
"""
header="## Release Notes\n\n"
postprocessors = [
  {pattern = "<REPO>", replace = "https://github.com/afuetterer/test5"}
]
trim = true

[git]
commit_parsers = [
  {message = "^feat", group = "<!-- 0 -->Features"},
  {message = "^fix", group = "<!-- 1 -->Bug Fixes"},
  {message = "^perf", group = "<!-- 2 -->Performance improvements"},
  {message = "^refactor", group = "<!-- 3 -->Code Refactoring"},
  {message = "^test", group = "<!-- 4 -->Testing"},
  {message = "^docs", group = "<!-- 5 -->Documentation"}
]
commit_preprocessors = [
  {pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/pull/${2}))"}
]
conventional_commits = true
filter_commits = true
filter_unconventional = true
sort_commits = "newest"
