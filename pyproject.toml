[build-system]  # Ref: https://docs.astral.sh/uv/concepts/build-backend
build-backend = "uv_build"
requires = [ "uv-build" ]

[project]
name = "test5"
version = "0.14.0"
description = "A Scythe for harvesting OAI-PMH repositories."
readme = "README.md"
keywords = [
  "metadatas",
]
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [
  { name = "Heinz-Alexander Fütterer" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Text Processing :: Markup :: XML",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "lxml>=5.3",
]

[dependency-groups]
dev = [
  "prek",
]

[tool.semantic_release]  # Ref: https://python-semantic-release.readthedocs.io/en/latest/configuration/configuration.html#semantic-release-settings
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_message = "chore: release {version}\n\nAutomatically generated by python-semantic-release [skip ci]"
allow_zero_version = true
major_on_zero = false
tag_format = "{version}"
version_toml = [
  "pyproject.toml:project.version",
]
build_command = """
sed -i "s/^version: .*/version: $NEW_VERSION/" CITATION.cff
sed -i "s/^date-released: .*/date-released: $(date "+%Y-%m-%d")/" CITATION.cff
python -m pip install uv
uv lock --upgrade-package "$PACKAGE_NAME" --exclude-newer="1 week"
uvx git-cliff --config=.github/templates/changelog.toml --unreleased --tag "${NEW_VERSION}" --prepend CHANGELOG.md
git add CITATION.cff CHANGELOG.md uv.lock
uv build
"""
