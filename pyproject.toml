[build-system]  # Ref: https://docs.astral.sh/uv/concepts/build-backend
build-backend = "uv_build"
requires = [ "uv-build" ]

[project]
name = "test5"
version = "0.5.1"
description = "A Scythe for harvesting OAI-PMH repositories."
readme = "README.md"
keywords = [
  "metadata",
  "oai-pmh",
  "oai-pmh-client",
]
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [
  { name = "Heinz-Alexander Fütterer" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Text Processing :: Markup :: XML",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "lxml>=5.3",
]

[dependency-groups]
dev = [
  "prek",
]

[tool.semantic_release]  # Ref: https://python-semantic-release.readthedocs.io/en/latest/configuration/configuration.html#semantic-release-settings
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_message = "chore: release {version}\n\nAutomatically generated by python-semantic-release [skip ci]"
allow_zero_version = true
major_on_zero = false
tag_format = "{version}"
version_toml = [
  "pyproject.toml:project.version",
]
build_command = """
sed -i "s/^version: .*/version: $NEW_VERSION/" CITATION.cff
sed -i "s/^date-released: .*/date-released: $(date "+%Y-%m-%d")/" CITATION.cff
python -m pip install uv
uv lock --upgrade-package "$PACKAGE_NAME" --exclude-newer="1 week"
uvx git-cliff --unreleased --tag "${NEW_VERSION}" --prepend CHANGELOG.md -vv
git add CITATION.cff CHANGELOG.md uv.lock
uv build
"""

# --------------------------------------------

# git-cliff
# Ref: https://git-cliff.org/docs/configuration
# ------------------------------------------------------------------------------

[tool.git-cliff.changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
This project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html). See
[conventional commits](https://www.conventionalcommits.org/en/v1.0.0/) for commit guidelines.\n
"""
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version }}](<REPO>/compare/{{ previous.version }}..{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
    {% else %}\
        ## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
    {% endif %}\
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        - **{{commit.scope}}:**{% if commit.breaking %} [**breaking**]{% endif %} \
            {{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if commit.scope -%}
        {% else -%}
            - {% if commit.breaking %} [**breaking**]{% endif %}\
                {{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))
        {% endif -%}
    {% endfor -%}
{% endfor %}\n
"""
trim = true
# output = "CHANGELOG.md"
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/afuetterer/test5" },
]

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features"},
  { message = "^fix", group = "<!-- 1 -->Bug Fixes"},
  { message = "^perf", group = "<!-- 2 -->Performance"},
  { message = "^refactor", group = "<!-- 3 -->Refactor"},
  { message = "^test", group = "<!-- 4 -->Testing"},
  { message = "^docs", group = "<!-- 5 -->Documentation"}, 
]
filter_commits = true
sort_commits = "newest"
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/pull/${2}))" },
]

